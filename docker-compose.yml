services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vsm-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vsm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend